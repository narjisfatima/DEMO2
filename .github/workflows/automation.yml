name: CFIN and RMS Tests
on:
  push:
    branches: 
      - main
      - feature/demo 
  schedule:
    - cron: '50 11 * * *'   #minute hour day month day-of-week

  pull_request:
    branches: 
      - main

  workflow_dispatch:

jobs:
  test:
    name: Run CFIN and RMS Test Cases
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run CFIN and RMS tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
